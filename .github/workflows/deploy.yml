name: Build, verify, and deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  # Per-ref, so a pull request run can never cancel a live main deploy.
  group: pages-${{ github.ref }}
  # Cancel superseded PR runs only. A deploy-bearing run must never be
  # cancelled: two Dependabot auto-merges landing seconds apart each dispatch a
  # run into this group, and with unconditional cancel-in-progress the earlier
  # one is killed mid-deploy -- a `cancelled` run reads as "a run existed"
  # while nothing was published.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Every outcome the page renders carries data-verdict, every number it
  # reports about a run carries data-claim, each marker is covered by a
  # recorded mutation, and nothing renders an outcome outside a marker. Its own
  # job so it is its own check, and so it can be a REQUIRED status check on
  # main: a check that runs but cannot block anything is decoration.
  verdict-gate:
    name: verdict-gate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
      # CI is set by Actions, so playwright.config.ts turns off
      # reuseExistingServer and the suite can only hit a server built from this
      # checkout. A reused or shared-port server makes a real kill look like a
      # survivor; this lab's port (4731) is pinned in the catalog's
      # tools/playwright-ports.json.
      - name: Verdict coverage, per-marker verdicts, and claims
        run: npm run test:verdicts

  build:
    name: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      # configure-pages@v6 enables Pages on first use and needs these. With
      # `contents: read` alone it 403s.
      pages: write
      id-token: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      # The WHOLE suite gates the deploy, not just the a11y half: a job that
      # runs only the browser specs can publish a build whose cryptography is
      # broken. The count is asserted so a run that collects zero test files
      # cannot exit 0 and read as a pass.
      - name: Unit and correctness tests
        env:
          # Without this vitest colours the summary, and the escape sequences
          # land BETWEEN "Tests" and the number -- so a plain grep for the
          # count matches nothing and the guard fails a run whose tests all
          # passed. That happened here on the first deploy. The sed below
          # strips ANSI anyway, because a guard that cannot read its own
          # evidence is worse than no guard.
          NO_COLOR: '1'
        run: |
          set -o pipefail   # or `tee` returns 0 and a failing suite reads green
          npm run test -- --reporter=verbose 2>&1 | tee vitest.log
          passed=$(sed -E 's/\x1b\[[0-9;]*m//g' vitest.log \
            | sed -nE 's/.*Tests[[:space:]]+([0-9]+) passed.*/\1/p' | tail -1)
          echo "vitest reported ${passed:-0} passing tests"
          # A test step that runs ZERO tests exits 0 (§4.1e), so assert the
          # count rather than the exit status alone.
          [ -n "$passed" ] && [ "$passed" -gt 0 ] \
            || { echo "::error::vitest reported no passing tests"; exit 1; }
      - name: Production build
        run: npm run build
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
      - name: Accessibility and claims gate
        run: npm run test:a11y
      - name: Configure GitHub Pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v6
      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    # NOT `== 'push'`. That would also skip workflow_dispatch, which is the one
    # trigger the Dependabot auto-merge below depends on: the dispatched run
    # would build, pass the gate, and skip this job, so the site would never
    # update.
    if: github.event_name != 'pull_request'
    needs: [build, verdict-gate]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

  dependabot-auto-merge:
    # `needs:` is the whole safety argument -- the gate decides, not the
    # version number. A major that breaks the lab fails the gate and the pull
    # request stays open for a human.
    if: github.event_name == 'pull_request' && github.actor == 'dependabot[bot]'
    needs: [build, verdict-gate]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
      # actions: write is required for the deploy dispatch below. Without it
      # `gh workflow run` returns HTTP 403 "Resource not accessible by
      # integration", the merged bump never deploys, and the site quietly keeps
      # serving the previous build.
      actions: write
    steps:
      - name: Read Dependabot metadata
        uses: dependabot/fetch-metadata@v3
      - name: Merge any bump whose gate passed and dispatch deployment
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: |
          for attempt in 1 2 3; do
            gh pr merge --squash --delete-branch "$PR_URL" && merged=1 && break
            sleep 15   # a sibling PR merging first moves main under us
          done
          # Fail loudly. `exit 0` here leaves a green job, an open pull request
          # with a passing gate, and an annotation nobody reads.
          [[ -n "$merged" ]] || { echo "::error::gate passed but the merge did not land after 3 attempts"; exit 1; }
          # A merge made with GITHUB_TOKEN raises no push event -- GitHub suppresses
          # them so workflows cannot retrigger themselves -- so deploy would never run
          # and the site would keep serving the previous build. Ask for it explicitly;
          # a workflow_dispatch through the API is not suppressed. The dispatched run
          # is the same gate-then-deploy pipeline, so a bad merge still ships nothing.
          #
          # Dispatch the file THIS lab has: most are deploy.yml, some deploy-pages.yml
          # or pages.yml. A copied name 404s only on the auto-merge path, after the
          # merge has landed.
          gh workflow run deploy.yml --repo "$GITHUB_REPOSITORY" --ref main
